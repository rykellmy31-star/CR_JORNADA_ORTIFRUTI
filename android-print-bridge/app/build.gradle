plugins { id 'com.android.application' }

def code = (System.getenv('APP_VERSION_CODE') ?: '2').toInteger()
def stableKeyPath = System.getenv('ANDROID_SIGNING_KEYSTORE_PATH')

android {
 namespace 'com.crjornada.express.print'
 compileSdk 35
 defaultConfig {
  applicationId 'com.crjornada.express.print'
  minSdk 26
  targetSdk 35
  versionCode code
  versionName '1.0.' + code
 }
 signingConfigs {
  if (stableKeyPath) {
   release {
    storeFile file(stableKeyPath)
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (stableKeyPath) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation 'androidx.core:core:1.15.0'
}
