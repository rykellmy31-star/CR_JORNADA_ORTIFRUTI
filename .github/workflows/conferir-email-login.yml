name: Conferir email do login Hortifruti
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conferir-email-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    env:
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
    steps:
      - name: Conferir se o email do login é o email cadastrado
        shell: bash
        run: |
          test -n "$SUPERADMIN_EMAIL" || { echo "::error::Segredo de email ausente"; exit 1; }
          node --input-type=module <<'NODE'
          import {createHash,timingSafeEqual} from 'node:crypto';
          const current=(process.env.SUPERADMIN_EMAIL||'').trim().toLowerCase();
          const currentHash=createHash('sha256').update(current,'utf8').digest();
          const expectedHash=Buffer.from('a25bcf66b04ad277e722478d1eb15f51fe22e1b4814ae0fc7ece827499a5e932','hex');
          console.log('O email digitado na captura corresponde ao email do cadastro: '+(timingSafeEqual(currentHash,expectedHash)?'SIM':'NÃO'));
          NODE
