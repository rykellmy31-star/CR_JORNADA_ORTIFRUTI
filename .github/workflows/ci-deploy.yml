name: Test and deploy Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'))
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install required Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$JWT_SECRET" || (echo 'Missing GitHub secret JWT_SECRET' >&2; exit 1)
          test -n "$CRM_API_KEY" || (echo 'Missing GitHub secret CRM_API_KEY' >&2; exit 1)
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --name cr-jornada-hortifruti
          printf '%s' "$CRM_API_KEY" | npx wrangler secret put CRM_API_KEY --name cr-jornada-hortifruti
      - name: Install optional Evolution secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_WEBHOOK_TOKEN: ${{ secrets.EVOLUTION_WEBHOOK_TOKEN }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          for name in EVOLUTION_API_URL EVOLUTION_API_KEY EVOLUTION_WEBHOOK_TOKEN PUBLIC_APP_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name" --name cr-jornada-hortifruti; fi
          done
      - name: Deploy Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
