name: Diagnosticar login inicial do Hortifruti

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
      SUPERADMIN_INITIAL_PASSWORD: ${{ secrets.SUPERADMIN_INITIAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultar conta sem mostrar dados privados
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPERADMIN_EMAIL" && test -n "$SUPERADMIN_INITIAL_PASSWORD"
          npx wrangler d1 execute cr-jornada-hortifruti-db --remote --json \
            --command="SELECT email, password_hash FROM users WHERE role='superadmin' LIMIT 1" \
            > "$RUNNER_TEMP/conta-admin.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {pbkdf2Sync, timingSafeEqual} from 'node:crypto';
          const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/conta-admin.json','utf8'));
          const row=result?.[0]?.results?.[0];
          if(!row)throw Error('Conta de Super Admin não encontrada no D1');
          const emailMatches=row.email.toLowerCase()===(process.env.SUPERADMIN_EMAIL||'').trim().toLowerCase();
          const parts=row.password_hash.split('$');
          if(parts.length!==4||parts[0]!=='pbkdf2')throw Error('Formato da senha armazenada inesperado');
          const derived=pbkdf2Sync(process.env.SUPERADMIN_INITIAL_PASSWORD,Buffer.from(parts[2],'hex'),Number(parts[1]),32,'sha256');
          const expected=Buffer.from(parts[3],'hex');
          const passwordMatches=derived.length===expected.length && timingSafeEqual(derived,expected);
          console.log('E-mail da conta corresponde ao segredo do GitHub: '+(emailMatches?'SIM':'NÃO'));
          console.log('Senha armazenada corresponde ao segredo do GitHub: '+(passwordMatches?'SIM':'NÃO'));
          NODE

      - name: Verificar autenticação real da API sem mostrar credenciais
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_FILE="$(mktemp "$RUNNER_TEMP/hortifruti-login.XXXXXX")"
          RESPONSE_FILE="$(mktemp "$RUNNER_TEMP/hortifruti-response.XXXXXX")"
          chmod 600 "$PAYLOAD_FILE" "$RESPONSE_FILE"
          trap 'rm -f "$PAYLOAD_FILE" "$RESPONSE_FILE"' EXIT
          export PAYLOAD_FILE
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync(process.env.PAYLOAD_FILE,JSON.stringify({
            email:(process.env.SUPERADMIN_EMAIL||'').trim().toLowerCase(),
            password:process.env.SUPERADMIN_INITIAL_PASSWORD||''
          }),{mode:0o600});
          NODE
          code="$(curl --silent --show-error --max-time 30 --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary "@$PAYLOAD_FILE" \
            https://cr-jornada-hortifruti.netssh3-0.workers.dev/api/auth/login)"
          echo "Resultado de login com as credenciais do GitHub: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::A API não conseguiu autenticar as credenciais válidas do banco."
            exit 1
          fi
          echo "Autenticação com credenciais cadastradas no GitHub: OK"
