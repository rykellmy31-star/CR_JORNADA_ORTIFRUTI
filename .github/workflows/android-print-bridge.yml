name: APK Android - CR Jornada Express Impressão

on:
  push:
    branches: [main, feature/express-fila-impressao-20261121]
    paths:
      - 'android-print-bridge/**'
      - '.github/workflows/android-print-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-print-bridge/**'
      - '.github/workflows/android-print-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK de teste Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK debug (não distribuível em loja de aplicativos)
        run: gradle -p android-print-bridge :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cr-jornada-express-impressao-android-beta
          path: android-print-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
